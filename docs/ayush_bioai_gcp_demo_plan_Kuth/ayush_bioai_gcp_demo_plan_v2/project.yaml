owner: Mevreon.ai
# Scenario-based routing (replaces the former single demo_case). See docs/16 and
# contracts/scenario_schema.md. The former piperine_mrsa_nora_ciprofloxacin case is now the
# archived scenario `archived_trikatu_prior`.
scenario_registry: configs/scenarios/scenario_registry.yaml
default_scenario: primary_kuth_pseudomonas
