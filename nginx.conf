# ============================================================
# MEVREON BIO-AI PLATFORM — nginx Configuration
# Optimized for serving the React SPA on Cloud Run
# ============================================================
# Cloud Run injects $PORT as an environment variable.
# nginx:alpine's default entrypoint processes .template files
# in /etc/nginx/templates/ and substitutes env vars automatically.
# ============================================================

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API Backend Proxy ──
    # Forward all /api/ requests to the FastAPI backend service
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA Routing ──
    # All non-file requests fall back to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip Compression ──
    # Compress text-based assets for faster delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        text/csv
        chemical/x-pdb
        chemical/x-mdl-sdfile;

    # ── Static Asset Caching ──
    # Vite hashes JS/CSS filenames, so aggressive caching is safe
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Molecular Data Files ──
    # PDB, SDF, PDBQT, CIF — serve with correct MIME types
    location /outputs/ {
        expires 7d;
        add_header Cache-Control "public";

        # Chemical file MIME types
        types {
            chemical/x-pdb pdb;
            chemical/x-mdl-sdfile sdf;
            text/plain pdbqt;
            chemical/x-cif cif;
            text/csv csv;
            application/json json;
        }
    }

    location /molecules/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /data/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Error Pages ──
    error_page 404 /index.html;

    # ── Disable access log for health checks ──
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
