<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="100%" stop-color="#0a1329"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="8"/>

  <!-- Molecular Node Network & DNA Double Helix representation -->
  <g filter="url(#glow)">
    <!-- Helix strands -->
    <path d="M 140 120 C 220 180, 292 332, 372 392" fill="none" stroke="url(#cyan-grad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 372 120 C 292 180, 220 332, 140 392" fill="none" stroke="url(#purple-grad)" stroke-width="24" stroke-linecap="round"/>

    <!-- Cross rungs / molecular bonds -->
    <line x1="180" y1="150" x2="332" y2="150" stroke="#22d3ee" stroke-width="12" opacity="0.85" stroke-dasharray="8 6"/>
    <line x1="210" y1="210" x2="302" y2="210" stroke="#14b8a6" stroke-width="12" opacity="0.85"/>
    <line x1="230" y1="256" x2="282" y2="256" stroke="#818cf8" stroke-width="14" opacity="0.9"/>
    <line x1="210" y1="302" x2="302" y2="302" stroke="#a855f7" stroke-width="12" opacity="0.85"/>
    <line x1="180" y1="362" x2="332" y2="362" stroke="#c084fc" stroke-width="12" opacity="0.85" stroke-dasharray="8 6"/>

    <!-- Central bioactive core sphere -->
    <circle cx="256" cy="256" r="32" fill="#22d3ee"/>
    <circle cx="256" cy="256" r="18" fill="#ffffff"/>

    <!-- Outer molecular atoms -->
    <circle cx="140" cy="120" r="22" fill="#22d3ee"/>
    <circle cx="372" cy="120" r="22" fill="#a855f7"/>
    <circle cx="140" cy="392" r="22" fill="#a855f7"/>
    <circle cx="372" cy="392" r="22" fill="#22d3ee"/>
  </g>
</svg>
